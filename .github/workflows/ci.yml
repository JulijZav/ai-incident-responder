name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/task-tracker --set postgres.password=ci

      - name: Render chart
        run: helm template tt charts/task-tracker --set postgres.password=ci

  alerts:
    runs-on: ubuntu-24.04
    env:
      PROMETHEUS_VERSION: "3.15.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install promtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check rules
        run: promtool check rules charts/task-tracker/rules/task-tracker.rules.yaml
      - name: Test rules
        run: promtool test rules charts/task-tracker/rules/task-tracker.rules.test.yaml