apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: incident-lab

servers: 1
agents: 2

image: rancher/k3s:v1.35.5-k3s1

kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6550"

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: "120s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true