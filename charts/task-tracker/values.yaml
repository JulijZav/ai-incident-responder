api:
  replicas: 2

  image:
    repository: task-tracker
    tag: "0.1.0"
    pullPolicy: Never

  port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  port: 80

postgres:
  image: postgres:16.4
  user: tasktracker
  database: tasktracker

  password: ""

  storage: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi